# =====================================================================
# News risk layer — configuration
# v1 MODE: PAPER TRADING ONLY. News is a RISK overlay only:
#   * adverse news can BLOCK / downgrade a paper buy
#   * positive news gives at most a small informational boost and can NEVER,
#     on its own, turn a non-buy into a buy.
# No secrets live here. NewsAPI (key-gated) stays disabled in v1 (₹0-cost).
# =====================================================================
news:
  enabled: true

  providers:
    yfinance:
      enabled: true            # reuses headlines already fetched with the price snapshot (no extra cost)
      max_items: 10
    gdelt:
      enabled: true            # GDELT 2.0 Doc API — free, no key. Resilient: failures degrade to "no news".
      max_items: 15
      lookback_hours: 48
      timeout_seconds: 8
      base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    newsapi:
      enabled: false           # requires NEWSAPI_KEY — intentionally OFF in v1
      reason: "Key-gated paid source; disabled to keep v1 ₹0-cost."

  cache:
    enabled: true
    ttl_minutes: 60            # don't re-hit GDELT for the same symbol within this window

  freshness:
    fresh_hours: 24            # items newer than this are "fresh"
    max_age_hours: 96          # items older than this are context-only (won't block)

  relevance:
    min_score: 0.30            # below this an item is treated as noise
    require_relevance_for_gdelt: true   # GDELT is keyword-broad; insist on a symbol/company match
    keep_yfinance_unfiltered: true      # yfinance items are already symbol-tagged
    # Shared first names do not count as a company hit on their own.
    group_name_rejects: [tata, adani, bajaj, birla, mahindra, godrej, hdfc, icici]
    aliases:
      TATAMOTORS.NS: ["tata motors", "tatamotors"]
      TATASTEEL.NS: ["tata steel", "tatasteel"]
      HDFCBANK.NS: ["hdfc bank"]
      ICICIBANK.NS: ["icici bank"]
      SBIN.NS: ["state bank of india", "state bank", "sbi"]
      BHARTIARTL.NS: ["bharti airtel", "airtel"]
      LT.NS: ["larsen & toubro", "larsen and toubro"]
    # Known desks outrank an unknown blog. Applied as a relevance multiplier, capped at 1.
    source_trust:
      nseindia.com: 1.15
      bseindia.com: 1.15
      economictimes: 1.10
      livemint: 1.10
      moneycontrol: 1.10
      business-standard: 1.10
      reuters: 1.10

  # How news verdicts map to action. The engine can only ADD caution.
  blocking:
    high_risk_news_blocks_buy: true            # HIGH/CRITICAL adverse news -> no new paper buy
    critical_news_triggers_exit_review: true   # CRITICAL news on a held position -> EXIT_REVIEW (advisory, never auto-sells)
    medium_risk_news_triggers_manual_review: true  # MEDIUM adverse news on a buy candidate -> MANUAL_REVIEW

  scoring:
    positive_sentiment_boost_max: 3.0   # cap on the informational boost; NOT applied to cross the buy threshold

  sentiment:
    # --- finance-aware scorer (deterministic). Values mirror code defaults. ---
    weighted_terms:
      critical_negative: { weight: -1.0, terms: [fraud, scam, ponzi, embezzle, siphon, forensic audit] }
      strong_negative:   { weight: -0.7, terms: [probe, investigation, default, lawsuit, downgrade, insolvency, bankruptcy, share pledge, promoter pledge, tax raid, whistleblower] }
      mild_negative:     { weight: -0.4, terms: [miss, weak results, profit warning, recall, fine, penalty, promoter selling, promoter stake sale, gst demand] }
      mild_positive:     { weight:  0.4, terms: [order win, upgrade, expansion, new contract, wins order] }
      strong_positive:   { weight:  0.6, terms: [strong results, record profit, debt reduction, beats] }
    negators: [denies, denied, deny, "no", "not", cleared of, rejects, rejected, dismisses, dismissed, refutes, unfounded, "false", without merit]
    negation_window: 4
    neutral_deadband: 0.15
    recency: { full_weight_hours: 24, floor_weight: 0.3 }
    entity_proximity: { window_tokens: 6, near_boost: 0.2, far_penalty: 0.3 }
    confidence:
      single_source_penalty: 0.3
      conflict_penalty: 0.5
      agreement_bonus: 0.25
      manual_review_min_confidence: 0.6
    plugin_scoring: { neutral_base: 65, max_positive: 78, min_negative: 25 }
    negative_keywords:
      - fraud
      - scam
      - probe
      - investigation
      - penalty
      - downgrade
      - weak results
      - loss
      - default
      - resignation
      - regulatory action
      - lawsuit
      - debt concern
      - raid
      - ban
      - share pledge
      - promoter pledge
      - promoter selling
      - tax raid
      - whistleblower
      - gst demand
      - fine
      - recall
      - miss
      - profit warning
      - insolvency
      - bankruptcy
    positive_keywords:
      - strong results
      - order win
      - expansion
      - approval
      - upgrade
      - margin improvement
      - debt reduction
      - record
      - beats
      - wins order
      - new contract

  # Event classification: text -> (event type, risk). Worst risk across matches wins.
  event_rules:
    - type: FRAUD
      risk: CRITICAL
      keywords: [fraud, scam, embezzle, siphon, ponzi, forensic audit]
    - type: REGULATORY
      risk: HIGH
      keywords: [sebi, sebi order, regulatory action, probe, investigation, raid, ban, show cause, penalty notice, sfio, adjudication order, consent order, gst demand, tax raid, income-tax raid, income tax raid]
    - type: LEGAL
      risk: HIGH
      keywords: [lawsuit, litigation, insolvency, bankruptcy, default, nclt, arrest, whistleblower]
    - type: RATING_DOWNGRADE
      risk: HIGH
      keywords: [downgrade, rating cut, outlook negative, credit concern]
    - type: PLEDGE
      risk: HIGH
      keywords: [share pledge, promoter pledge, pledged shares, invocation of pledge, pledge invocation]
    - type: PROMOTER_SALE
      risk: MEDIUM
      keywords: [promoter selling, promoter stake sale, promoter offload, block deal]
    - type: MANAGEMENT_CHANGE
      risk: MEDIUM
      keywords: [resignation, steps down, resigns, auditor resigns, ceo exit, cfo exit]
    - type: EARNINGS_MISS
      risk: MEDIUM
      keywords: [profit falls, loss widens, misses estimates, weak results, margin pressure, profit warning]
    - type: EARNINGS_BEAT
      risk: NONE
      keywords: [beats estimates, strong results, profit rises, record profit, margin improvement]
    - type: ORDER_WIN
      risk: NONE
      keywords: [order win, wins contract, bags order, new order, new contract]
    - type: EXPANSION
      risk: NONE
      keywords: [expansion, capacity addition, new plant, acquisition completed]
    - type: MACRO
      risk: LOW
      keywords: [rbi, inflation, rate hike, crude oil, fed, gst, monsoon]

  alerting:
    email_enabled: true
    alert_email_to: "sahabhi115@gmail.com"
    max_alerts_per_run: 5
    send_on:
      critical_news: true               # any CRITICAL news on watchlist/held symbol
      high_risk_news_on_position: true  # HIGH news on a held bot position
      high_risk_news_blocked_buy: true  # HIGH news that blocked a would-be buy

  export:
    max_items_public: 200     # cap news items written to public/data
    max_assessments_public: 50
